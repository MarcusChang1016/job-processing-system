services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: job_processing
      POSTGRES_USER: job_processing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_processing -d job_processing"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
